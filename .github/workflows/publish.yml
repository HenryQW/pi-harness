name: Publish extensions

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish new package versions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          published=0
          declare -A seen=()

          # Prerequisites must exist before their consumers release.
          for manifest in extensions/pi-herdr/package.json extensions/pi-multi-codex/package.json extensions/pi-task-models/package.json extensions/pi-subagent/package.json extensions/*/package.json; do
            case "$manifest" in
              extensions/pi-herdr/package.json|extensions/pi-multi-codex/package.json|extensions/pi-task-models/package.json|extensions/pi-subagent/package.json)
                [ "${seen[$manifest]:-0}" = 1 ] && continue
                seen[$manifest]=1
                ;;
            esac
            name="$(node -p "require('./$manifest').name")"
            if [ "$(node -p "Boolean(require('./$manifest').private)")" = true ]; then
              continue
            fi

            local_version="$(node -p "require('./$manifest').version")"
            remote_version="$(npm view "$name" version 2>/dev/null || true)"
            if [ "$local_version" = "$remote_version" ]; then
              continue
            fi

            echo "Publishing $name@$local_version"
            (cd "${manifest%/package.json}" && npm publish)
            published=1
          done

          if [ "$published" = 0 ]; then
            echo 'No new package versions.'
          fi
