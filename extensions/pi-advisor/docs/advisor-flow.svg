<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="advisor-flow-title advisor-flow-desc" id="advisor-flow-root">
<title id="advisor-flow-title">Pi Advisor review flow</title>
<desc id="advisor-flow-desc">When an agent run reaches the settle boundary, review gates decide whether the advisor runs. If all gates pass, one tool-free Model Task request returns a reply. PASS, nit, concern, malformed, timeout, or error replies show a notice and the run settles. A blocker adds a visible pi-advisor-blocker message and continues the run one time for each user prompt.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      #advisor-flow-root { color: #101828; }</style>
<marker id="advisor-flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#4c5665"/></marker>
<marker id="advisor-flow-arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1d4ed8"/></marker>
</defs>
<rect width="1280" height="720" fill="#f0eee9"/>
<text x="40" y="52" font-family="Instrument Serif, serif" font-size="28" fill="#101828">An advisor review before the run settles</text>
<!-- Connections precede nodes. Each path has its own attachment point. -->
<g fill="none" stroke="#4c5665" stroke-width="1.2" marker-end="url(#advisor-flow-arrow)">
<path d="M240 168 H320"/>
<path d="M600 168 H680"/>
<path d="M900 168 H980"/>
<path d="M460 296 V336"/>
<path d="M1000 296 V384 H600"/>
</g>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#advisor-flow-arrow-blue)">
<path d="M1180 296 V528 H900"/>
<path d="M680 528 H148 Q140 528 140 520 V216"/>
</g>
<!-- Label masks stay clear of their connectors and all node rectangles. -->
<g fill="#f0eee9">
<rect x="612" y="148" width="56" height="12"/>
<rect x="464" y="306" width="72" height="12"/>
<rect x="730" y="364" width="140" height="12"/>
<rect x="1184" y="406" width="44" height="12"/>
<rect x="400" y="508" width="120" height="12"/>
</g>
<g font-family="Geist Mono, monospace" font-size="8" fill="#4c5665">
<text x="640" y="157" text-anchor="middle">ALL PASS</text>
<text x="468" y="315">ANY GATE FAILS</text>
<text x="800" y="373" text-anchor="middle">NO BLOCKER, OR CAP REACHED</text>
<text x="1188" y="415" fill="#1d4ed8">BLOCKER</text>
<text x="460" y="517" text-anchor="middle" fill="#1d4ed8">NEXT TURN, SAME RUN</text>
</g>
<rect x="40" y="120" width="200" height="96" rx="8" fill="#ffffff" stroke="#101828" stroke-opacity="0.2"/>
<rect x="320" y="96" width="280" height="200" rx="8" fill="#e6e4de" stroke="#101828" stroke-opacity="0.2"/>
<rect x="680" y="120" width="220" height="96" rx="8" fill="#ffffff" stroke="#101828" stroke-opacity="0.2"/>
<rect x="980" y="96" width="260" height="200" rx="8" fill="#e6e4de" stroke="#101828" stroke-opacity="0.2"/>
<rect x="320" y="336" width="280" height="96" rx="8" fill="#ffffff" stroke="#101828" stroke-opacity="0.2"/>
<rect x="680" y="480" width="220" height="96" rx="8" fill="#1d4ed8" fill-opacity="0.08" stroke="#1d4ed8"/>
<g font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#101828">
<text x="60" y="152">Agent run</text>
<text x="344" y="128">Review gates</text>
<text x="700" y="152">Advisor review</text>
<text x="1004" y="128">Reply</text>
<text x="340" y="368">Settle</text>
<text x="700" y="512">Blocker continuation</text>
</g>
<g font-family="Geist Mono, monospace" font-size="8" fill="#4c5665">
<text x="60" y="176">model turns and tool calls</text>
<text x="60" y="196">then agent_before_settle</text>
<text x="344" y="152">advisor on for this branch</text>
<text x="344" y="176">UI available</text>
<text x="344" y="200">outcome: completed</text>
<text x="344" y="224">a tool call since the prompt</text>
<text x="344" y="248">no other continuation draft</text>
<text x="700" y="176">Model Task pi-advisor/review</text>
<text x="700" y="196">one tool-free request, 90 s limit</text>
<text x="1004" y="152">PASS: info notice</text>
<text x="1004" y="176">nit, concern: notes notice</text>
<text x="1004" y="200">blocker: notes warning</text>
<text x="1004" y="224">malformed: one warning per session</text>
<text x="1004" y="248">timeout or model error: one warning</text>
<text x="340" y="392">agent_settled</text>
<text x="340" y="412">no review, or notes only</text>
<text x="700" y="536">visible pi-advisor-blocker</text>
<text x="700" y="556">continue: true, once per prompt</text>
</g>
<text x="344" y="276" font-family="Geist, sans-serif" font-size="12" fill="#4c5665">All gates must pass.</text>
<text x="1004" y="276" font-family="Geist, sans-serif" font-size="12" fill="#4c5665">Only a blocker continues.</text>
<path d="M40 644 H1240" stroke="#101828" stroke-opacity="0.12"/>
<text x="40" y="680" font-family="Geist, sans-serif" font-size="12" fill="#4c5665">The advisor reads only the user prompt and the run record. Each check reads the advisor state from the current conversation branch.</text>
</svg>
