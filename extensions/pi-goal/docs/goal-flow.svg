<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="goal-flow-title goal-flow-desc" id="goal-flow-root">
<title id="goal-flow-title">Pi Goal continuation flow</title>
<desc id="goal-flow-desc">Each stop checks another handler's continuation, the user interface, the branch goal and run outcome, the budget, the continuation cap, a live delegated result, and repeated tool activity in that order; the result is another handler's next turn, settlement, a wait for delegated delivery, or a hidden goal continuation.</desc>
<defs>
      <style>#goal-flow-root { color: #101828; }
      #goal-flow-root .diagram-container { overflow-x: auto; }</style>
<marker id="goal-flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#4c5665"/></marker>
<marker id="goal-flow-arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1d4ed8"/></marker>
</defs>
<rect width="1280" height="720" fill="#f0eee9"/>
<text x="40" y="52" font-family="Instrument Serif, serif" font-size="28" fill="#101828">One goal, continued until evidence or a stop limit</text>
<!-- Connections precede nodes. Each path has its own attachment point. -->
<g fill="none" stroke="#4c5665" stroke-width="1.2" marker-end="url(#goal-flow-arrow)">
<path d="M240 168 H320"/>
<path d="M560 168 H640"/>
<path d="M860 168 H960"/>
<path d="M960 288 H860"/>
<path d="M640 288 H548 Q540 288 540 280 V216"/>
<path d="M1100 528 V560"/>
<path d="M380 216 V536"/>
<path d="M560 600 H960"/>
</g>
<g fill="none" stroke="#4c5665" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#goal-flow-arrow)">
<path d="M960 388 H860"/>
<path d="M640 388 H508 Q500 388 500 380 V216"/>
</g>
<g fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#goal-flow-arrow-blue)">
<path d="M960 492 H860"/>
<path d="M640 492 H488 Q480 492 480 484 V216"/>
</g>
<!-- Label masks stay clear of their connectors and all node rectangles. -->
<g fill="#f0eee9">
<rect x="876" y="268" width="68" height="12"/>
<rect x="872" y="368" width="76" height="12"/>
<rect x="876" y="472" width="68" height="12"/>
<rect x="1108" y="536" width="64" height="12"/>
<rect x="388" y="292" width="76" height="12"/>
<rect x="720" y="580" width="80" height="12"/>
</g>
<g font-family="Geist Mono, monospace" font-size="8" fill="#4c5665">
<text x="910" y="277" text-anchor="middle">1: SHARED</text>
<text x="910" y="377" text-anchor="middle">6: PENDING</text>
<text x="910" y="481" text-anchor="middle" fill="#1d4ed8">NO MATCH</text>
<text x="1112" y="545">2&#8211;5, 7</text>
<text x="392" y="301">COMPLETE/DROP</text>
<text x="760" y="589" text-anchor="middle">NEXT STOP</text>
</g>
<rect x="40" y="120" width="200" height="96" rx="8" fill="#ffffff" stroke="#101828" stroke-opacity="0.2"/>
<rect x="320" y="120" width="240" height="96" rx="8" fill="#ffffff" stroke="#101828" stroke-opacity="0.2"/>
<rect x="640" y="120" width="220" height="96" rx="8" fill="#ffffff" stroke="#101828" stroke-opacity="0.2"/>
<rect x="960" y="96" width="280" height="432" rx="8" fill="#e6e4de" stroke="#101828" stroke-opacity="0.2"/>
<rect x="640" y="252" width="220" height="72" rx="8" fill="#ffffff" stroke="#101828" stroke-opacity="0.2"/>
<rect x="640" y="352" width="220" height="72" rx="8" fill="#ffffff" stroke="#4c5665" stroke-dasharray="5,4"/>
<rect x="640" y="452" width="220" height="76" rx="8" fill="#1d4ed8" fill-opacity="0.08" stroke="#1d4ed8"/>
<rect x="320" y="536" width="240" height="88" rx="8" fill="#ffffff" stroke="#101828" stroke-opacity="0.2"/>
<rect x="960" y="560" width="280" height="64" rx="8" fill="#e6e4de" stroke="#101828" stroke-opacity="0.2"/>
<g font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#101828">
<text x="60" y="152">User prompt</text>
<text x="340" y="152">Agent run</text>
<text x="660" y="152">Agent stops</text>
<text x="984" y="128">Stop guards, in order</text>
<text x="660" y="276">Another handler continues</text>
<text x="660" y="376">Wait for delegated result</text>
<text x="660" y="476">Hidden goal continuation</text>
<text x="340" y="560">Goal complete or dropped</text>
<text x="984" y="584">Settle</text>
</g>
<g font-family="Geist Mono, monospace" font-size="8" fill="#4c5665">
<text x="60" y="176">before_agent_start</text>
<text x="60" y="196">+ hidden pi-goal-context</text>
<text x="340" y="176">model turns and tool calls</text>
<text x="340" y="196">goal: create / get</text>
<text x="660" y="176">agent_before_settle</text>
<text x="660" y="196">goal read from branch</text>
<text x="984" y="192">continue or custom_message draft</text>
<text x="660" y="300">keep its draft; no goal message</text>
<text x="660" y="400">result or failure starts a turn</text>
<text x="660" y="500">pi-goal-continuation; continue: true</text>
<text x="660" y="516">full goal context</text>
<text x="340" y="584">complete: evidence per deliverable</text>
<text x="340" y="608">/goal drop</text>
<text x="984" y="608">agent_settled</text>
</g>
<g font-family="Geist, sans-serif" font-size="12" fill="#4c5665">
<text x="984" y="152">Use the first matching guard.</text>
<text x="984" y="176">1. Another handler continues</text>
<text x="984" y="216">2. No user interface</text>
<text x="984" y="240">3. No active goal, abort, or error</text>
<text x="984" y="264">4. Token budget is exhausted</text>
<text x="984" y="288">5. 20 continuations since prompt</text>
<text x="984" y="312">6. Live delegated result is pending</text>
<text x="984" y="336">7. Same tool activity twice</text>
<text x="984" y="400">Budget and cap apply before waiting.</text>
<text x="984" y="424">Waiting skips the no-progress check.</text>
</g>
<path d="M40 644 H1240" stroke="#101828" stroke-opacity="0.12"/>
<g font-family="Geist, sans-serif" font-size="12" fill="#4c5665">
<text x="40" y="664">Hidden messages are not shown in the transcript. Each stop reads the goal from the current conversation branch.</text>
<text x="40" y="688">Compaction can abort the run. Stop limits leave an active goal active. A pending result must belong to the current session.</text>
</g>
</svg>
