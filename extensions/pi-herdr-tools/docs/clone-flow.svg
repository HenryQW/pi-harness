<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clone-flow-title clone-flow-desc" id="clone-flow-root">
      <title id="clone-flow-title">Pi Herdr clone flow</title>
      <desc id="clone-flow-desc">The tab route saves its clone session before creating a tab; the worktree route creates its workspace and selects a pane before saving its clone session, and both routes start Pi before focusing the tab with separate recovery rules.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #clone-flow-root { color: #101828; font-family: 'Geist', system-ui, sans-serif; }
      #clone-flow-root .diagram-container { overflow-x: auto; }
      #clone-flow-root .lane-rule { stroke: rgba(16,24,40,.141); stroke-width: 1; }
      #clone-flow-root .lane-rule-strong { stroke: #d5d8db; stroke-width: 1; }
      #clone-flow-root .meta { fill: #6a7282; font: 400 8px 'Geist Mono', monospace; letter-spacing: .08em; }
      #clone-flow-root .node { fill: #fff; stroke: #101828; stroke-width: 1; }
      #clone-flow-root .node-focal { fill: rgba(29,78,216,.08); stroke: #1d4ed8; stroke-width: 1.2; }
      #clone-flow-root .decision { fill: #fff; stroke: #101828; stroke-width: 1; }
      #clone-flow-root .recovery { fill: rgba(16,24,40,.05); stroke: #4c5665; stroke-width: 1; }
      #clone-flow-root .name { fill: #101828; font: 600 12px 'Geist', sans-serif; text-anchor: middle; }
      #clone-flow-root .name-left { fill: #101828; font: 600 12px 'Geist', sans-serif; }
      #clone-flow-root .sub { fill: #4c5665; font: 400 9px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .02em; }
      #clone-flow-root .sub-left { fill: #4c5665; font: 500 9px 'Geist Mono', monospace; letter-spacing: .08em; }
      #clone-flow-root .edge { fill: none; stroke: #4c5665; stroke-width: 1.2; marker-end: url(#clone-flow-clone-flow-arrow); }
      #clone-flow-root .edge-focal { fill: none; stroke: #1d4ed8; stroke-width: 1.4; marker-end: url(#clone-flow-clone-flow-arrow-accent); }
      #clone-flow-root .edge-failure { fill: none; stroke: #6a7282; stroke-width: 1.2; stroke-dasharray: 5 4; marker-end: url(#clone-flow-clone-flow-arrow); }
      #clone-flow-root .legend { fill: #4c5665; font: 400 8px 'Geist', sans-serif; }</style>
        <style>
          .lane-rule { stroke: rgba(16,24,40,.141); stroke-width: 1; }
          .lane-rule-strong { stroke: #d5d8db; stroke-width: 1; }
          .eyebrow { fill: #4c5665; font: 500 8px 'Geist Mono', monospace; letter-spacing: .16em; }
          .meta { fill: #6a7282; font: 400 8px 'Geist Mono', monospace; letter-spacing: .08em; }
          .node { fill: #fff; stroke: #101828; stroke-width: 1; }
          .node-focal { fill: rgba(29,78,216,.08); stroke: #1d4ed8; stroke-width: 1.2; }
          .decision { fill: #fff; stroke: #101828; stroke-width: 1; }
          .recovery { fill: rgba(16,24,40,.05); stroke: #4c5665; stroke-width: 1; }
          .name { fill: #101828; font: 600 12px 'Geist', sans-serif; text-anchor: middle; }
          .name-left { fill: #101828; font: 600 12px 'Geist', sans-serif; }
          .sub { fill: #4c5665; font: 400 9px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .02em; }
          .sub-left { fill: #4c5665; font: 500 9px 'Geist Mono', monospace; letter-spacing: .08em; }
          .edge { fill: none; stroke: #4c5665; stroke-width: 1.2; marker-end: url(#clone-flow-clone-flow-arrow); }
          .edge-focal { fill: none; stroke: #1d4ed8; stroke-width: 1.4; marker-end: url(#clone-flow-clone-flow-arrow-accent); }
          .edge-failure { fill: none; stroke: #6a7282; stroke-width: 1.2; stroke-dasharray: 5 4; marker-end: url(#clone-flow-clone-flow-arrow); }
          .legend { fill: #4c5665; font: 400 8px 'Geist', sans-serif; }
        </style>
        <marker id="clone-flow-clone-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#4c5665"/>
        </marker>
        <marker id="clone-flow-clone-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
        </marker>
        <marker id="clone-flow-clone-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f0eee9"/>

      <text class="eyebrow" x="40" y="56">ACTIVE-PATH CLONE</text>
      <text class="meta" x="1240" y="56" text-anchor="end">STATIC · TWO TARGETS · SEPARATE SAVE ORDER</text>

      <!-- Swimlanes -->
      <line class="lane-rule-strong" x1="40" y1="80" x2="1240" y2="80"/>
      <line class="lane-rule" x1="40" y1="192" x2="1240" y2="192"/>
      <line class="lane-rule" x1="40" y1="320" x2="1240" y2="320"/>
      <line class="lane-rule" x1="40" y1="516" x2="1240" y2="516"/>
      <line class="lane-rule-strong" x1="40" y1="620" x2="1240" y2="620"/>
      <line class="lane-rule-strong" x1="176" y1="80" x2="176" y2="620"/>

      <text class="eyebrow" x="56" y="140">CURRENT PI</text>
      <text class="eyebrow" x="56" y="260">CLONE COMMAND</text>
      <text class="eyebrow" x="56" y="420">HERDR TARGET</text>
      <text class="eyebrow" x="56" y="572">RECOVERY</text>

      <!-- Worktree route comes first so the tab-route bridge masks its crossing. -->
      <path class="edge" d="M264 172 V456 Q264 464 272 464 H400"/>
      <path class="edge" d="M624 464 H776 Q784 464 784 456 V264 Q784 256 792 256 H800"/>
      <path class="edge" d="M984 256 H1136 Q1144 256 1144 264 V336"/>

      <!-- Tab route saves the session before creating the tab. -->
      <path class="edge" d="M344 140 H360 Q368 140 368 148 V248 Q368 256 376 256 H400"/>
      <path class="edge" d="M480 288 V360 Q480 368 488 368 H592"/>
      <path d="M776 368 Q776 360 784 360 Q792 360 792 368" fill="none" stroke="#f0eee9" stroke-width="6"/>
      <path class="edge-focal" d="M752 368 H776 Q776 360 784 360 Q792 360 792 368 H1040"/>
      <path class="edge" d="M1144 400 V440"/>

      <!-- Process nodes -->
      <rect class="node" x="184" y="108" width="160" height="64" rx="6"/>
      <text class="name" x="264" y="132">Validate source</text>
      <text class="sub" x="264" y="148">PANE · SESSION · ACTIVE LEAF</text>
      <text class="sub" x="264" y="160">LIVE STATE IF NOT ON DISK</text>
      <text class="meta" x="400" y="128">ACTIVE PATH: ROOT → CURRENT LEAF</text>
      <text class="meta" x="400" y="148">NO SIBLINGS · NO STILL-STREAMING OUTPUT</text>

      <rect class="node" x="400" y="224" width="160" height="64" rx="6"/>
      <text class="name" x="480" y="248">Save tab clone session</text>
      <text class="sub" x="480" y="264">ACTIVE PATH ONLY</text>
      <text class="sub" x="480" y="276">CURRENT CWD</text>

      <rect class="node" x="592" y="336" width="160" height="64" rx="6"/>
      <text class="name" x="672" y="360">Create clone tab</text>
      <text class="sub" x="672" y="376">CURRENT WORKSPACE + CWD</text>
      <text class="sub" x="672" y="388">NO FOCUS</text>

      <rect class="node" x="400" y="424" width="224" height="80" rx="6"/>
      <text class="name" x="512" y="444">Create worktree workspace</text>
      <text class="sub" x="512" y="460">FRESH CHECKOUT · NO FOCUS</text>
      <text class="sub" x="512" y="476">WAIT FOR LAYOUT AGENT</text>
      <text class="sub" x="512" y="492">ROOT PANE OR EXTRA TAB IF BUSY</text>

      <rect class="node" x="800" y="224" width="184" height="64" rx="6"/>
      <text class="name" x="892" y="248">Save worktree clone session</text>
      <text class="sub" x="892" y="264">ACTIVE PATH ONLY</text>
      <text class="sub" x="892" y="276">FRESH CHECKOUT CWD</text>

      <rect class="node-focal" x="1040" y="336" width="200" height="64" rx="6"/>
      <text class="name" x="1140" y="356">Start Pi</text>
      <text class="sub" x="1140" y="372">--session &lt;absolute-clone-file&gt;</text>
      <text class="sub" x="1140" y="388">WORKTREE ROOT BUSY → EXTRA TAB</text>

      <rect class="node" x="1040" y="440" width="200" height="56" rx="6"/>
      <text class="name" x="1140" y="464">Focus clone tab</text>
      <text class="sub" x="1140" y="480">ONLY AFTER PI STARTS</text>

      <!-- Recovery details are grouped by the operation that failed. -->
      <rect class="recovery" x="184" y="528" width="1056" height="88" rx="8"/>
      <line class="lane-rule" x1="800" y1="528" x2="800" y2="616"/>
      <line class="lane-rule" x1="1024" y1="528" x2="1024" y2="616"/>
      <text class="sub-left" x="200" y="544">BEFORE START</text>
      <text class="legend" x="200" y="560">Tab creation fails: delete the clone; if cleanup fails, report the file. Incomplete reply: retain clone + known IDs.</text>
      <text class="legend" x="200" y="576">Worktree creation or early extra-tab failure: no clone yet. Partial worktree: inspect herdr workspace list.</text>
      <text class="legend" x="200" y="592">Worktree clone save fails: retain the worktree. Inspect known target IDs before manual cleanup.</text>
      <text class="legend" x="200" y="608">A worktree layout agent stays in its pane; the clone uses an extra tab when needed.</text>
      <text class="sub-left" x="816" y="544">START ATTEMPTED</text>
      <text class="name-left" x="816" y="568">Retain target + session file</text>
      <text class="legend" x="816" y="588">Launch may be unconfirmed.</text>
      <text class="legend" x="816" y="604">The error reports known IDs.</text>
      <text class="sub-left" x="1040" y="544">FOCUS FAILS</text>
      <text class="name-left" x="1040" y="568">Warn; clone keeps running</text>
      <text class="legend" x="1040" y="588">Focus the clone tab in Herdr.</text>

      <!-- Legend -->
      <line class="lane-rule" x1="40" y1="640" x2="1240" y2="640"/>
      <text class="eyebrow" x="40" y="668">KEY</text>
      <line x1="104" y1="664" x2="140" y2="664" stroke="#4c5665" stroke-width="1.2" marker-end="url(#clone-flow-clone-flow-arrow)"/>
      <text class="legend" x="152" y="668">Main flow</text>
      <rect x="464" y="656" width="24" height="16" rx="4" fill="#1d4ed8" fill-opacity=".08" stroke="#1d4ed8" stroke-width="1.2"/>
      <text class="legend" x="500" y="668">Launch boundary</text>
      <text class="meta" x="1240" y="668" text-anchor="end">ORIGINAL SESSION STAYS ACTIVE</text>
    </svg>
