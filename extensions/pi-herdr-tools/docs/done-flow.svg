<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="done-flow-title done-flow-desc" id="done-flow-root">
      <title id="done-flow-title">Safe worktree completion</title>
      <desc id="done-flow-desc">Normal /done asks for confirmation before waiting for Pi to become idle, then checks tab use and removes the worktree before tab cleanup and a conditional parent update; explicit force skips confirmation and the tab-use check.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #done-flow-root { --paper: #f0eee9;
      --ink: #101828;
      --muted: #4c5665;
      --accent: #1d4ed8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #done-flow-root { color: var(--ink); font-family: var(--sans); }
      #done-flow-root .diagram-container { overflow-x: auto; }
      #done-flow-root .lifeline { stroke: rgba(16,24,40,.20); stroke-width: 1; stroke-dasharray: 4 4; }
      #done-flow-root .activation { fill: rgba(16,24,40,.06); stroke: #4c5665; stroke-width: .8; }
      #done-flow-root .fragment { fill: rgba(16,24,40,.02); stroke: rgba(16,24,40,.24); stroke-width: 1; }
      #done-flow-root .fragment-tab { fill: #f0eee9; stroke: rgba(16,24,40,.24); stroke-width: 1; }
      #done-flow-root .fragment-label { fill: #4c5665; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .12em; }
      #done-flow-root .guard { fill: #4c5665; font: 400 8px 'Geist Mono', monospace; letter-spacing: .04em; }
      #done-flow-root .gate-badge { fill: rgba(29,78,216,.08); stroke: #1d4ed8; stroke-width: 1; }
      #done-flow-root .gate-label { fill: #1d4ed8; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .08em; }
      #done-flow-root .message { fill: none; stroke: #4c5665; stroke-width: 1.2; marker-end: url(#done-flow-done-flow-arrow); }
      #done-flow-root .message-return { fill: none; stroke: #4c5665; stroke-width: 1.2; stroke-dasharray: 4 4; marker-end: url(#done-flow-done-flow-arrow); }
      #done-flow-root .message-accent { fill: none; stroke: #1d4ed8; stroke-width: 1.4; marker-end: url(#done-flow-done-flow-arrow-accent); }
      #done-flow-root .label-mask { fill: #f0eee9; }
      #done-flow-root .message-label { fill: #4c5665; font: 400 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .04em; }
      #done-flow-root .message-label-accent { fill: #1d4ed8; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .04em; }
      #done-flow-root .actor { fill: #fff; stroke: #101828; stroke-width: 1; }
      #done-flow-root .actor-input { fill: rgba(76,86,101,.10); stroke: #6a7282; stroke-width: 1; }
      #done-flow-root .actor-state { fill: rgba(16,24,40,.05); stroke: #4c5665; stroke-width: 1; }
      #done-flow-root .actor-name { fill: #101828; font: 600 12px 'Geist', sans-serif; text-anchor: middle; }
      #done-flow-root .actor-sub { fill: #4c5665; font: 400 9px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .04em; }
      #done-flow-root .boundary { stroke: rgba(16,24,40,.24); stroke-width: 1; stroke-dasharray: 4 4; }
      #done-flow-root .boundary-label { fill: #4c5665; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .08em; }
      #done-flow-root .legend-label { fill: #4c5665; font: 400 8px 'Geist', sans-serif; }
      #done-flow-root .legend-title { fill: #6a7282; font: 500 8px 'Geist Mono', monospace; letter-spacing: .16em; }</style>
        <style>
          .lifeline { stroke: rgba(16,24,40,.20); stroke-width: 1; stroke-dasharray: 4 4; }
          .activation { fill: rgba(16,24,40,.06); stroke: #4c5665; stroke-width: .8; }
          .fragment { fill: rgba(16,24,40,.02); stroke: rgba(16,24,40,.24); stroke-width: 1; }
          .fragment-tab { fill: #f0eee9; stroke: rgba(16,24,40,.24); stroke-width: 1; }
          .fragment-label { fill: #4c5665; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .12em; }
          .guard { fill: #4c5665; font: 400 8px 'Geist Mono', monospace; letter-spacing: .04em; }
          .gate-badge { fill: rgba(29,78,216,.08); stroke: #1d4ed8; stroke-width: 1; }
          .gate-label { fill: #1d4ed8; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .08em; }
          .message { fill: none; stroke: #4c5665; stroke-width: 1.2; marker-end: url(#done-flow-done-flow-arrow); }
          .message-return { fill: none; stroke: #4c5665; stroke-width: 1.2; stroke-dasharray: 4 4; marker-end: url(#done-flow-done-flow-arrow); }
          .message-accent { fill: none; stroke: #1d4ed8; stroke-width: 1.4; marker-end: url(#done-flow-done-flow-arrow-accent); }
          .label-mask { fill: #f0eee9; }
          .message-label { fill: #4c5665; font: 400 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .04em; }
          .message-label-accent { fill: #1d4ed8; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .04em; }
          .actor { fill: #fff; stroke: #101828; stroke-width: 1; }
          .actor-input { fill: rgba(76,86,101,.10); stroke: #6a7282; stroke-width: 1; }
          .actor-state { fill: rgba(16,24,40,.05); stroke: #4c5665; stroke-width: 1; }
          .actor-name { fill: #101828; font: 600 12px 'Geist', sans-serif; text-anchor: middle; }
          .actor-sub { fill: #4c5665; font: 400 9px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .04em; }
          .boundary { stroke: rgba(16,24,40,.24); stroke-width: 1; stroke-dasharray: 4 4; }
          .boundary-label { fill: #4c5665; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; letter-spacing: .08em; }
          .legend-label { fill: #4c5665; font: 400 8px 'Geist', sans-serif; }
          .legend-title { fill: #6a7282; font: 500 8px 'Geist Mono', monospace; letter-spacing: .16em; }
        </style>
        <marker id="done-flow-done-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#4c5665"/>
        </marker>
        <marker id="done-flow-done-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
        </marker>
        <marker id="done-flow-done-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f0eee9"/>

      <!-- Optional normal-mode gates; both modes wait before cleanup. -->
      <rect class="fragment" x="120" y="144" width="364" height="144" rx="4"/>
      <rect class="fragment" x="388" y="352" width="292" height="92" rx="4"/>

      <!-- Lifelines and activation bars -->
      <line class="lifeline" x1="136" y1="96" x2="136" y2="624"/>
      <line class="lifeline" x1="404" y1="96" x2="404" y2="624"/>
      <line class="lifeline" x1="652" y1="96" x2="652" y2="624"/>
      <line class="lifeline" x1="1124" y1="96" x2="1124" y2="624"/>
      <rect class="activation" x="400" y="124" width="8" height="476"/>
      <rect class="activation" x="648" y="396" width="8" height="28"/>
      <rect class="activation" x="648" y="456" width="8" height="16"/>
      <rect class="activation" x="1120" y="544" width="8" height="24"/>

      <rect class="fragment-tab" x="120" y="144" width="40" height="16" rx="4"/>
      <text class="fragment-label" x="140" y="156">OPT</text>
      <rect class="label-mask" x="128" y="164" width="344" height="16"/>
      <text class="guard" x="132" y="176">[normal /done; --force skips confirmation]</text>
      <rect class="fragment-tab" x="388" y="352" width="40" height="16" rx="4"/>
      <text class="fragment-label" x="408" y="364">OPT</text>
      <text class="guard" x="440" y="364">[normal /done]</text>

      <!-- Messages: time flows downward -->
      <line class="message" x1="136" y1="124" x2="400" y2="124"/>
      <rect class="label-mask" x="224" y="104" width="88" height="12" rx="4"/>
      <text class="message-label" x="268" y="112">RUN /DONE</text>

      <line class="message" x1="400" y1="208" x2="136" y2="208"/>
      <rect class="label-mask" x="224" y="188" width="88" height="12" rx="4"/>
      <text class="message-label" x="268" y="196">CONFIRM?</text>
      <line class="message-return" x1="136" y1="244" x2="400" y2="244"/>
      <rect class="label-mask" x="224" y="224" width="88" height="12" rx="4"/>
      <text class="message-label" x="268" y="232">YES / STOP</text>

      <path class="message" d="M408 308 H452 Q460 308 460 316 V332 Q460 340 452 340 H412"/>
      <rect class="label-mask" x="468" y="316" width="112" height="12" rx="4"/>
      <text class="message-label" x="524" y="324">WAIT FOR IDLE</text>

      <line class="message" x1="408" y1="396" x2="648" y2="396"/>
      <rect class="label-mask" x="480" y="376" width="96" height="12" rx="4"/>
      <text class="message-label" x="528" y="384">CHECK TAB USE</text>
      <line class="message-return" x1="648" y1="424" x2="408" y2="424"/>
      <rect class="label-mask" x="484" y="404" width="88" height="12" rx="4"/>
      <text class="message-label" x="528" y="412">CLEAR / REFUSE</text>

      <!-- Safety details apply to the current flow, not a proposed flow. -->
      <text class="guard" x="744" y="180">Decline: stop without waiting or changing the checkout.</text>
      <text class="guard" x="744" y="204">Both modes wait for Pi to become idle before cleanup.</text>
      <text class="guard" x="744" y="372">Normal: another workspace using this checkout blocks removal.</text>
      <text class="guard" x="744" y="396">Git refuses dirty worktrees unless --force is set.</text>
      <text class="guard" x="744" y="420">--force skips the tab-use check; data loss is irreversible.</text>
      <text class="guard" x="744" y="444">Locks serialize worktree removal and primary-checkout updates.</text>

      <line class="message-accent" x1="408" y1="464" x2="648" y2="464"/>
      <rect class="label-mask" x="448" y="436" width="160" height="20" rx="4"/>
      <text class="message-label-accent" x="528" y="444">CLEAN / FORCE</text>
      <text class="message-label-accent" x="528" y="452">REMOVE WORKTREE</text>

      <!-- Successful removal is the partial-success boundary -->
      <line class="boundary" x1="40" y1="488" x2="392" y2="488"/>
      <line class="boundary" x1="888" y1="488" x2="1240" y2="488"/>
      <text class="boundary-label" x="640" y="492">PARTIAL-SUCCESS BOUNDARY · WORKTREE REMOVED</text>

      <line class="message" x1="400" y1="516" x2="136" y2="516"/>
      <rect class="label-mask" x="180" y="496" width="176" height="12" rx="4"/>
      <text class="message-label" x="268" y="504">CLOSE SIBLINGS</text>

      <line class="message" x1="408" y1="544" x2="1120" y2="544"/>
      <rect class="label-mask" x="684" y="516" width="160" height="20" rx="4"/>
      <text class="message-label" x="764" y="524">LINKED PRIMARY</text>
      <text class="message-label" x="764" y="532">PULL --FF-ONLY</text>

      <line class="message-return" x1="1120" y1="568" x2="408" y2="568"/>
      <rect class="label-mask" x="696" y="548" width="136" height="12" rx="4"/>
      <text class="message-label" x="764" y="556">DONE / FAILED</text>

      <line class="message" x1="400" y1="600" x2="136" y2="600"/>
      <rect class="label-mask" x="184" y="580" width="168" height="12" rx="4"/>
      <text class="message-label" x="268" y="588">CLOSE THIS TAB</text>

      <!-- Actors are drawn after messages -->
      <rect x="56" y="40" width="160" height="56" rx="6" fill="#f0eee9"/>
      <rect class="actor-input" x="56" y="40" width="160" height="56" rx="6"/>
      <text class="actor-name" x="136" y="68">Herdr workspace</text>
      <text class="actor-sub" x="136" y="84">THIS WORKSPACE</text>

      <rect x="324" y="40" width="160" height="56" rx="6" fill="#f0eee9"/>
      <rect class="actor" x="324" y="40" width="160" height="56" rx="6"/>
      <text class="actor-name" x="404" y="68">Pi /done</text>
      <text class="actor-sub" x="404" y="84">IDLE BEFORE CLEANUP</text>

      <rect x="572" y="40" width="160" height="56" rx="6" fill="#f0eee9"/>
      <rect class="actor-state" x="572" y="40" width="160" height="56" rx="6"/>
      <text class="actor-name" x="652" y="68">Removal gate</text>
      <text class="actor-sub" x="652" y="84">WORKTREE + TAB USE</text>

      <rect x="1044" y="40" width="160" height="56" rx="6" fill="#f0eee9"/>
      <rect class="actor" x="1044" y="40" width="160" height="56" rx="6"/>
      <text class="actor-name" x="1124" y="68">Parent checkout</text>
      <text class="actor-sub" x="1124" y="84">LINKED + NON-BARE</text>

      <text class="guard" x="744" y="604">Close this tab last, even if sibling cleanup or pull fails.</text>

      <!-- Legend strip -->
      <line x1="40" y1="640" x2="1240" y2="640" stroke="#101828" stroke-opacity=".141" stroke-width=".8"/>
      <text class="legend-title" x="40" y="668">LEGEND</text>

      <line class="message" x1="128" y1="664" x2="164" y2="664"/>
      <text class="legend-label" x="176" y="668">Action</text>

      <line class="message-return" x1="264" y1="664" x2="300" y2="664"/>
      <text class="legend-label" x="312" y="668">Return or result</text>

      <rect class="fragment" x="448" y="656" width="32" height="16" rx="4"/>
      <text class="fragment-label" x="464" y="668">OPT</text>
      <text class="legend-label" x="492" y="668">Normal-mode gate</text>

      <line class="message-accent" x1="624" y1="664" x2="660" y2="664"/>
      <text class="legend-label" x="672" y="668">Successful removal</text>
    </svg>
