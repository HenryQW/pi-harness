<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From conversation to saved prompt</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f0eee9;
      --ink: #101828;
      --muted: #4c5665;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1280px; min-width: 0; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.15;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; height: auto; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Prompt lifecycle · Data flow</p>
    <h1>From conversation to saved prompt</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Prompt lifecycle diagram; scroll horizontally on narrow screens">
    <svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prompt-lifecycle-title prompt-lifecycle-desc">
      <title id="prompt-lifecycle-title">Automatic analysis path to a saved prompt</title>
      <desc id="prompt-lifecycle-desc">Automatic candidates wait for /promptor, while manual candidates display immediately; both require a valid Main review and explicit user approval before saving a new prompt file.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <polygon points="0 0, 8 4, 0 8" fill="#4c5665"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <polygon points="0 0, 8 4, 0 8" fill="#1d4ed8"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f0eee9"/>
      <text x="40" y="72" fill="#101828" font-family="'Instrument Serif', serif" font-size="28">Automatic analysis path</text>

      <!-- Six stages use wider nodes and larger role lanes, not scaled type. -->
      <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle">
        <g fill="#4c5665">
          <rect x="228" y="96" width="32" height="16" rx="2" fill="rgba(16,24,40,0.10)"/>
          <text x="244" y="108">01</text>
          <text x="244" y="128" letter-spacing="1.2">INPUT</text>
          <rect x="404" y="96" width="32" height="16" rx="2" fill="rgba(16,24,40,0.10)"/>
          <text x="420" y="108">02</text>
          <text x="420" y="128" letter-spacing="1.2">BOUND</text>
          <rect x="756" y="96" width="32" height="16" rx="2" fill="rgba(16,24,40,0.10)"/>
          <text x="772" y="108">04</text>
          <text x="772" y="128" letter-spacing="1.2">WAIT</text>
          <rect x="932" y="96" width="32" height="16" rx="2" fill="rgba(16,24,40,0.10)"/>
          <text x="948" y="108">05</text>
          <text x="948" y="128" letter-spacing="1.2">REFINE</text>
          <rect x="1108" y="96" width="32" height="16" rx="2" fill="rgba(16,24,40,0.10)"/>
          <text x="1124" y="108">06</text>
          <text x="1124" y="128" letter-spacing="1.2">SAVE</text>
        </g>
        <g fill="#1d4ed8">
          <rect x="580" y="96" width="32" height="16" rx="2" fill="rgba(29,78,216,0.14)"/>
          <text x="596" y="108">03</text>
          <text x="596" y="128" letter-spacing="1.2">DRAFT</text>
        </g>
      </g>

      <!-- Role lanes -->
      <rect x="40" y="140" width="1200" height="144" fill="rgba(16,24,40,0.018)"/>
      <rect x="40" y="428" width="1200" height="144" fill="rgba(16,24,40,0.018)"/>
      <g fill="none" stroke="rgba(16,24,40,0.14)" stroke-width="0.8">
        <line x1="40" y1="140" x2="1240" y2="140"/>
        <line x1="40" y1="284" x2="1240" y2="284"/>
        <line x1="40" y1="428" x2="1240" y2="428"/>
        <line x1="40" y1="572" x2="1240" y2="572"/>
        <line x1="148" y1="140" x2="148" y2="572"/>
      </g>
      <g fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing="1.2">
        <text x="92" y="216">YOU</text>
        <text x="92" y="360">EXTENSION</text>
        <text x="92" y="496">ISOLATED</text>
        <text x="92" y="508">CHILD</text>
      </g>

      <!-- Connectors and label masks precede all nodes. -->
      <g fill="none" stroke="#4c5665" stroke-width="1" marker-end="url(#arrow)">
        <path d="M324 212 H412 Q420 212 420 220 V308"/>
        <path d="M676 500 H764 Q772 500 772 492 V404"/>
        <path d="M852 356 H940 Q948 356 948 348 V260" stroke-dasharray="5,4"/>
        <path d="M1028 212 H1116 Q1124 212 1124 220 V308"/>
      </g>
      <path d="M500 356 H588 Q596 356 596 364 V452" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="604" y="400" width="72" height="16" rx="2" fill="#f0eee9"/>
      <text x="640" y="412" fill="#1d4ed8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.8">CONTEXT</text>

      <!-- Nodes: name text remains 12px; technical text remains 8px. -->
      <g>
        <rect x="164" y="164" width="160" height="96" rx="8" fill="#f0eee9"/>
        <rect x="164" y="164" width="160" height="96" rx="8" fill="rgba(76,86,101,0.10)" stroke="#6a7282"/>
        <rect x="176" y="176" width="32" height="16" rx="2" fill="rgba(76,86,101,0.14)"/>
        <text x="192" y="188" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">YOU</text>
        <text x="244" y="212" fill="#101828" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Conversation</text>
        <text x="244" y="232" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">requests · corrections</text>
        <text x="244" y="248" fill="#6a7282" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">active branch only</text>
      </g>
      <g>
        <rect x="340" y="308" width="160" height="96" rx="8" fill="#ffffff" stroke="#101828"/>
        <rect x="352" y="320" width="32" height="16" rx="2" fill="rgba(16,24,40,0.08)"/>
        <text x="368" y="332" fill="#101828" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">EXT</text>
        <text x="420" y="356" fill="#101828" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Bounded context</text>
        <text x="420" y="376" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">summary + messages</text>
        <text x="420" y="392" fill="#6a7282" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">≤ 30,000 chars</text>
      </g>
      <g>
        <rect x="516" y="452" width="160" height="96" rx="8" fill="#f0eee9"/>
        <rect x="516" y="452" width="160" height="96" rx="8" fill="rgba(29,78,216,0.08)" stroke="#1d4ed8" stroke-width="1.2"/>
        <rect x="528" y="464" width="32" height="16" rx="2" fill="rgba(29,78,216,0.14)"/>
        <text x="544" y="476" fill="#1d4ed8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">CHD</text>
        <text x="596" y="500" fill="#101828" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">One-turn draft</text>
        <text x="596" y="520" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">tool-free · isolated</text>
        <text x="596" y="536" fill="#6a7282" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">candidate JSON | null</text>
      </g>
      <g>
        <rect x="692" y="308" width="160" height="96" rx="8" fill="#ffffff" stroke="#101828"/>
        <rect x="704" y="320" width="32" height="16" rx="2" fill="rgba(16,24,40,0.08)"/>
        <text x="720" y="332" fill="#101828" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">EXT</text>
        <text x="772" y="356" fill="#101828" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Passive candidate</text>
        <text x="772" y="376" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">Prompt ready — /promptor</text>
        <text x="772" y="392" fill="#6a7282" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">stays in memory</text>
      </g>
      <g>
        <rect x="868" y="164" width="160" height="96" rx="8" fill="#f0eee9"/>
        <rect x="868" y="164" width="160" height="96" rx="8" fill="rgba(76,86,101,0.10)" stroke="#6a7282"/>
        <rect x="880" y="176" width="32" height="16" rx="2" fill="rgba(76,86,101,0.14)"/>
        <text x="896" y="188" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">YOU</text>
        <text x="948" y="212" fill="#101828" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Review with Main</text>
        <text x="948" y="232" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">show · refine · approve</text>
        <text x="948" y="248" fill="#6a7282" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">complete Markdown reply</text>
      </g>
      <g>
        <rect x="1044" y="308" width="160" height="96" rx="8" fill="#f0eee9"/>
        <rect x="1044" y="308" width="160" height="96" rx="8" fill="rgba(16,24,40,0.05)" stroke="#4c5665"/>
        <rect x="1056" y="320" width="32" height="16" rx="2" fill="rgba(16,24,40,0.10)"/>
        <text x="1072" y="332" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">FILE</text>
        <text x="1124" y="356" fill="#101828" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Saved prompt</text>
        <text x="1124" y="376" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">/promptor save [name]</text>
        <text x="1124" y="392" fill="#6a7282" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">prompts/&lt;name&gt;.md · new file</text>
      </g>

      <!-- Manual analysis skips WAIT, but does not skip review or approval. -->
      <text x="164" y="608" fill="#101828" font-family="'Geist', system-ui, sans-serif" font-size="12">Manual analysis displays its candidate immediately. Both paths require Main review and your approval before saving.</text>
      <text x="164" y="628" fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">/promptor dismiss discards a pending automatic candidate. Saving never replaces an existing file.</text>

      <!-- Horizontal bottom legend; all content stays inside the 40px safe area. -->
      <line x1="40" y1="644" x2="1240" y2="644" stroke="rgba(16,24,40,0.14)" stroke-width="0.8"/>
      <g fill="#4c5665" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">
        <text x="40" y="672" letter-spacing="1.2">LEGEND</text>
        <path d="M144 668 H176" fill="none" stroke="#4c5665" marker-end="url(#arrow)"/>
        <text x="188" y="672">CONTROLLED HANDOFF</text>
        <path d="M372 668 H404" fill="none" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="416" y="672">ISOLATED ANALYSIS</text>
        <path d="M596 668 H628" fill="none" stroke="#4c5665" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="640" y="672">WAIT FOR USER DISPLAY</text>
        <rect x="864" y="660" width="24" height="16" rx="2" fill="rgba(16,24,40,0.05)" stroke="#4c5665"/>
        <text x="900" y="672">SAVED AFTER APPROVAL</text>
      </g>
    </svg>
    </div>
  </main>
</body>
</html>
