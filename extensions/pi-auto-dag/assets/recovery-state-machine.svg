<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recovery-state-machine-title recovery-state-machine-desc">
      <title id="recovery-state-machine-title">Recovery state machine</title>
      <desc id="recovery-state-machine-desc">Auto DAG persists only pending, running, needs_attention, and completed. Interruptions and failures enter deliberate attention, where Main chooses retry, replace, verify, finalize, or final judgment approval before accepted completion.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap");</style>
        <marker id="recovery-state-machine-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="recovery-state-machine-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="recovery-state-machine-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- State transitions. Solid paths are checked execution; dashed paths require deliberate recovery. -->
      <line x1="72" y1="240" x2="120" y2="240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recovery-state-machine-arrow)"/>
      <line x1="344" y1="240" x2="480" y2="240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recovery-state-machine-arrow)"/>
      <line x1="704" y1="240" x2="904" y2="240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recovery-state-machine-arrow)"/>
      <line x1="1160" y1="240" x2="1208" y2="240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recovery-state-machine-arrow)"/>
      <line x1="576" y1="288" x2="576" y2="432" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recovery-state-machine-arrow)"/>
      <line x1="624" y1="432" x2="624" y2="288" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recovery-state-machine-arrow)"/>
      <path d="M 456 488 H 392 Q 384 488 384 480 V 368 Q 384 360 376 360 H 240 Q 232 360 232 352 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recovery-state-machine-arrow)"/>
      <path d="M 728 512 H 816 Q 824 512 824 504 V 368 Q 824 360 832 360 H 1032 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recovery-state-machine-arrow)"/>

      <!-- Transition labels -->
      <rect x="720" y="220" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="804" y="229" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">FINAL CHECKS + OPTIONAL JUDGMENT</text>
      <rect x="424" y="312" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="321" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">INTERRUPT · ABORT</text>
      <rect x="392" y="340" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="349" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">DRIFT · BUDGET · FAILURE</text>
      <rect x="236" y="340" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="308" y="349" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">RETRY · REPLACE · FINALIZE</text>
      <rect x="644" y="352" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="361" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">VERIFY</text>
      <rect x="844" y="340" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="892" y="349" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">APPROVE FINAL</text>

      <!-- Start and checked-execution states -->
      <circle cx="64" cy="240" r="6" fill="#2d3142"/>

      <rect x="120" y="192" width="224" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="120" y="192" width="224" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="128" y="200" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="148" y="209" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="232" y="244" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">pending</text>
      <text x="232" y="268" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">ready to run</text>

      <rect x="480" y="192" width="224" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="480" y="192" width="224" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="488" y="200" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="508" y="209" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="592" y="244" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">running</text>
      <text x="592" y="268" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">serial work + checks</text>

      <rect x="904" y="192" width="256" height="96" rx="8" fill="#f5f5f5"/>
      <rect x="904" y="192" width="256" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="912" y="200" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="932" y="209" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="1032" y="244" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">completed</text>
      <text x="1032" y="268" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">accepted = true</text>

      <!-- Deliberate attention state -->
      <rect x="456" y="432" width="272" height="120" rx="8" fill="#f5f5f5"/>
      <rect x="456" y="432" width="272" height="120" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="464" y="440" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="484" y="449" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="592" y="484" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">needs_attention</text>
      <text x="592" y="512" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">Main chooses a recovery action</text>
      <text x="592" y="532" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">never replays automatically</text>

      <!-- End dot is a terminal marker, not another persisted status. -->
      <circle cx="1216" cy="240" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="1216" cy="240" r="5" fill="#2d3142"/>

      <!-- Context labels -->
      <text x="120" y="160" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">CHECKED EXECUTION</text>
      <text x="456" y="408" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">DELIBERATE RECOVERY</text>
      <text x="984" y="408" fill="#2d3142" font-family="'Instrument Serif', serif" font-size="16" font-style="italic" text-anchor="middle">Approve only the unchanged final checked workspace.</text>
      <text x="40" y="40" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.18em">STATE MACHINE · AUTO DAG V9</text>
      <text x="40" y="80" fill="#2d3142" font-family="'Instrument Serif', serif" font-size="28">Deliberate recovery</text>
      <text x="40" y="112" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Only four lifecycle statuses persist.</text>

      <!-- Legend -->
      <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="672" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">KEY</text>
      <line x1="136" y1="668" x2="184" y2="668" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#recovery-state-machine-arrow)"/>
      <text x="200" y="672" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">checked execution</text>
      <line x1="392" y1="668" x2="440" y2="668" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recovery-state-machine-arrow)"/>
      <text x="456" y="672" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">deliberate recovery</text>
      <rect x="680" y="660" width="20" height="12" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="716" y="672" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">Main attention / acceptance</text>
    </svg>
