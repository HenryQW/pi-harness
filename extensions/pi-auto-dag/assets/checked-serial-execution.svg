<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="608" viewBox="0 0 1280 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="checked-serial-execution-title checked-serial-execution-desc">
      <title id="checked-serial-execution-title">Checked serial execution</title>
      <desc id="checked-serial-execution-desc">Auto DAG validates a request and workspace, persists important transitions, runs one eligible Role at a time, verifies direct checks and optional read-only judgment, retries only correctable work within two launched attempts, then accepts the unchanged checked workspace after final verification.</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap");</style>
        <marker id="checked-serial-execution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="checked-serial-execution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="checked-serial-execution-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1280" height="608" fill="#f5f5f5"/>

      <!-- Three balanced execution zones. -->
      <rect x="40" y="112" width="232" height="384" rx="8" fill="rgba(45,49,66,0.018)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
      <rect x="296" y="112" width="592" height="384" rx="8" fill="rgba(45,49,66,0.04)" stroke="rgba(79,93,117,0.60)" stroke-width="1.2"/>
      <rect x="912" y="112" width="328" height="384" rx="8" fill="rgba(45,49,66,0.018)" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>

      <!-- Visual heading and zone labels. -->
      <text x="40" y="32" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.18em">PROCESS · AUTO DAG V9</text>
      <text x="40" y="72" fill="#2d3142" font-family="'Instrument Serif', serif" font-size="28">Checked serial execution</text>
      <text x="56" y="140" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.14em">INTAKE</text>
      <text x="312" y="140" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.14em">SERIAL TASK CYCLE</text>
      <text x="928" y="140" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.14em">ACCEPTANCE</text>

      <!-- Checked execution, correction, and next-task connectors. Drawn before nodes. -->
      <line x1="156" y1="280" x2="156" y2="328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#checked-serial-execution-arrow)"/>
      <path d="M 248 376 H 280 Q 288 376 288 368 V 312 Q 288 304 296 304 H 328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#checked-serial-execution-arrow)"/>
      <line x1="504" y1="304" x2="552" y2="304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#checked-serial-execution-arrow)"/>
      <line x1="744" y1="304" x2="768" y2="304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#checked-serial-execution-arrow)"/>
      <path d="M 600 368 V 392 Q 600 400 592 400 H 448 Q 440 400 440 392 V 368" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#checked-serial-execution-arrow)"/>
      <line x1="704" y1="368" x2="704" y2="416" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#checked-serial-execution-arrow)"/>
      <path d="M 824 240 V 208 Q 824 200 816 200 H 416 Q 408 200 408 208 V 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#checked-serial-execution-arrow)"/>
      <line x1="880" y1="304" x2="936" y2="304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#checked-serial-execution-arrow)"/>
      <line x1="1076" y1="368" x2="1076" y2="400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#checked-serial-execution-arrow)"/>

      <!-- Connector labels keep an opaque 8px gap from their paths. -->
      <rect x="560" y="180" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="616" y="189" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">NO · NEXT TASK</text>
      <rect x="472" y="380" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="389" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">FRESH RETRY</text>
      <rect x="712" y="384" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="393" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">NO RETRY</text>
      <rect x="888" y="284" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="908" y="293" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="1084" y="376" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1104" y="385" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">PASS</text>

      <!-- Intake. -->
      <rect x="64" y="184" width="184" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="184" width="184" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="192" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="100" y="201" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">VALIDATE</text>
      <text x="156" y="232" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Validate</text>
      <text x="156" y="256" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">request schema · workspace</text>

      <rect x="64" y="328" width="184" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="328" width="184" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="72" y="336" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="94" y="345" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="156" y="376" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Persist durable state</text>
      <text x="156" y="408" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">v9 · each important transition</text>

      <!-- Dominant serial task cycle. -->
      <rect x="328" y="240" width="176" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="240" width="176" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="336" y="248" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="356" y="257" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">ROLE</text>
      <text x="416" y="284" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Launch eligible Role</text>
      <text x="416" y="308" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">pi-subagent · one at a time</text>
      <text x="416" y="324" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">worker report: context</text>
      <text x="416" y="340" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">not acceptance evidence</text>
      <text x="416" y="356" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">max 2 launched attempts</text>

      <rect x="552" y="240" width="192" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="552" y="240" width="192" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="560" y="248" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="584" y="257" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">CHECKS</text>
      <text x="648" y="284" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Direct checks</text>
      <text x="648" y="300" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ optional judgment</text>
      <text x="648" y="328" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">direct {command,args}</text>
      <text x="648" y="344" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">judgment is read-only</text>

      <polygon points="824,240 880,304 824,368 768,304" fill="#f5f5f5"/>
      <polygon points="824,240 880,304 824,368 768,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="824" y="296" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">All tasks</text>
      <text x="824" y="316" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">complete?</text>

      <rect x="608" y="416" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="608" y="416" width="176" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="616" y="424" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="636" y="433" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">PAUSE</text>
      <text x="696" y="452" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Needs attention</text>
      <text x="696" y="472" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">manual resume only</text>

      <!-- Acceptance. -->
      <rect x="936" y="240" width="280" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="936" y="240" width="280" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="944" y="248" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="964" y="257" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="1076" y="284" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Final checks</text>
      <text x="1076" y="300" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ optional judgment</text>
      <text x="1076" y="336" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">direct · combined workspace</text>
      <text x="1076" y="352" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">optional judgment · read-only</text>

      <rect x="936" y="400" width="280" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="936" y="400" width="280" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="944" y="408" width="56" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="972" y="417" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">ACCEPT</text>
      <text x="1076" y="440" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Accept unchanged</text>
      <text x="1076" y="456" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">checked workspace</text>
      <text x="1076" y="476" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">final evidence identifies state</text>

      <!-- Legend. -->
      <line x1="40" y1="528" x2="1240" y2="528" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">KEY</text>
      <line x1="128" y1="556" x2="176" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#checked-serial-execution-arrow)"/>
      <text x="192" y="560" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">checked execution</text>
      <line x1="360" y1="556" x2="408" y2="556" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#checked-serial-execution-arrow)"/>
      <text x="424" y="560" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">bounded correction</text>
      <rect x="640" y="548" width="20" height="12" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="676" y="560" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">focal evidence / acceptance</text>
    </svg>
