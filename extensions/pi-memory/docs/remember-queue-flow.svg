<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="remember-queue-flow-title remember-queue-flow-desc" id="remember-queue-flow-root">
  <title id="remember-queue-flow-title">Memory inbox and explicit requests</title>
  <desc id="remember-queue-flow-desc">Automatic conflicts enter a private group inbox. Only the user review command opens approval questions. Explicit remember requests wait while busy, then prepare and review live sources. Failures retain inbox candidates.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #remember-queue-flow-root { color: #101828; font-family: 'Geist', sans-serif; }
      #remember-queue-flow-root .title { fill: #101828; font: 400 28px 'Instrument Serif', serif; }
      #remember-queue-flow-root .name { fill: #101828; font: 600 12px 'Geist', sans-serif; text-anchor: middle; }
      #remember-queue-flow-root .body { fill: #4c5665; font: 400 12px 'Geist', sans-serif; text-anchor: middle; }
      #remember-queue-flow-root .code { fill: #4c5665; font: 400 8px 'Geist Mono', monospace; text-anchor: middle; }
      #remember-queue-flow-root .note { fill: #4c5665; font: 400 14px 'Geist', sans-serif; }
      #remember-queue-flow-root .node { fill: #ffffff; stroke: #101828; stroke-width: 1; }
      #remember-queue-flow-root .inbox { fill: #e6e4de; stroke: #4c5665; stroke-width: 1; }
      #remember-queue-flow-root .focus { fill: rgba(29,78,216,.08); stroke: #1d4ed8; stroke-width: 1; }
      #remember-queue-flow-root .edge { fill: none; stroke: #4c5665; stroke-width: 1.2; marker-end: url(#remember-queue-flow-review-arrow); }</style>
    <style>
      .title { fill: #101828; font: 400 28px 'Instrument Serif', serif; }
      .name { fill: #101828; font: 600 12px 'Geist', sans-serif; text-anchor: middle; }
      .body { fill: #4c5665; font: 400 12px 'Geist', sans-serif; text-anchor: middle; }
      .code { fill: #4c5665; font: 400 8px 'Geist Mono', monospace; text-anchor: middle; }
      .note { fill: #4c5665; font: 400 14px 'Geist', sans-serif; }
      .node { fill: #ffffff; stroke: #101828; stroke-width: 1; }
      .inbox { fill: #e6e4de; stroke: #4c5665; stroke-width: 1; }
      .focus { fill: rgba(29,78,216,.08); stroke: #1d4ed8; stroke-width: 1; }
      .edge { fill: none; stroke: #4c5665; stroke-width: 1.2; marker-end: url(#remember-queue-flow-review-arrow); }
    </style>
    <marker id="remember-queue-flow-review-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4c5665"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f0eee9"/>
  <text class="title" x="40" y="72">Automatic conflicts wait for explicit review</text>
  <path class="edge" d="M280 196 H352"/>
  <path class="edge" d="M592 196 H664"/>
  <path class="edge" d="M904 196 H976"/>
  <path class="edge" d="M1096 252 V416"/>
  <path class="edge" d="M280 472 H352"/>
  <path class="edge" d="M592 472 H664"/>
  <path class="edge" d="M904 472 H976"/>
  <rect class="node" x="40" y="140" width="240" height="112" rx="6"/>
  <text class="name" x="160" y="172">Automatic memory conflict</text>
  <text class="body" x="160" y="198">No dialog; continue the response</text>
  <text class="code" x="160" y="224">queued: true · saved: false</text>
  <rect class="inbox" x="352" y="140" width="240" height="112" rx="6"/>
  <text class="name" x="472" y="172">Private durable inbox</text>
  <text class="body" x="472" y="198">Complete mutations; locked updates</text>
  <text class="code" x="472" y="224">review-inbox.json · current group</text>
  <rect class="focus" x="664" y="140" width="240" height="112" rx="6"/>
  <text class="name" x="784" y="172">User starts review</text>
  <text class="body" x="784" y="198">Idle interactive terminal only</text>
  <text class="code" x="784" y="224">/memory-review</text>
  <rect class="node" x="976" y="140" width="240" height="112" rx="6"/>
  <text class="name" x="1096" y="172">Read live sources; ask</text>
  <text class="body" x="1096" y="198">Show the complete mutation</text>
  <text class="body" x="1096" y="224">Approve, discard, or retain</text>
  <text class="note" x="40" y="310">The widget shows only this group's count. Each completed response gives a short reminder.</text>
  <text class="note" x="40" y="342">Git worktrees share a group. Outside Git, the session starting directory selects the group.</text>
  <rect class="node" x="40" y="416" width="240" height="112" rx="6"/>
  <text class="name" x="160" y="448">Explicit remember request</text>
  <text class="body" x="160" y="474">While busy: wait for settlement</text>
  <text class="code" x="160" y="500">/remember &lt;instruction&gt;</text>
  <rect class="node" x="352" y="416" width="240" height="112" rx="6"/>
  <text class="name" x="472" y="448">Prepare from live sources</text>
  <text class="body" x="472" y="474">One entry and target, or decline</text>
  <text class="code" x="472" y="500">pi-memory/prepareCandidate</text>
  <rect class="node" x="664" y="416" width="240" height="112" rx="6"/>
  <text class="name" x="784" y="448">Review the candidate</text>
  <text class="body" x="784" y="474">Explicit requests can ask directly</text>
  <text class="code" x="784" y="500">pi-memory/reviewCandidate</text>
  <rect class="node" x="976" y="416" width="240" height="112" rx="6"/>
  <text class="name" x="1096" y="448">Recheck sources; save</text>
  <text class="body" x="1096" y="474">Apply one complete atomic mutation</text>
  <text class="body" x="1096" y="500">Then remove the approved inbox item</text>
  <text class="note" x="40" y="584">Failed writes and changed sources retain inbox candidates. Discard writes no memory.</text>
  <text class="note" x="40" y="614">Candidate review never edits SYSTEM.md. SYSTEM conflicts offer only discard or deferral.</text>
  <line x1="40" y1="640" x2="1240" y2="640" stroke="#4c5665"/>
  <text class="note" x="40" y="672">Restart clears temporary remember requests, not the inbox. Other groups remain unchanged.</text>
</svg>
