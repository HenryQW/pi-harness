<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi-pr routing flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      background: #f0eee9;
    }
    main { width: 100%; min-width: 0; max-width: 1280px; }
    .diagram-container { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; height: auto; }
  </style>
</head>
<body>
  <main>
    <div class="diagram-container" tabindex="0" role="region" aria-label="PR routing diagram; scroll horizontally on narrow screens">
    <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="pr-routing-title pr-routing-desc">
      <title id="pr-routing-title">How /pr picks each next route</title>
      <desc id="pr-routing-desc">The /pr command creates a PR only with no existing PR, a distinct branch ref, no Git operation in progress, and ahead commits or ordinary pending work; it links inferred open PRs, reports merged, closed, or configured draft PRs without changes, syncs and publishes local work, re-reads mergeability, updates branches, fixes CI, sweeps changes requested, unresolved threads, or new feedback, waits for CI or required Codex review within a shared budget when nothing else blocks, reports pending human review or policy without changes, and merges only after confirmation and a fresh readiness check.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="pr-routing-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
          <polygon points="0 0, 8 4, 0 8" fill="#4c5665"/>
        </marker>
        <marker id="pr-routing-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
          <polygon points="0 0, 8 4, 0 8" fill="#1d4ed8"/>
        </marker>
        <marker id="pr-routing-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
          <polygon points="0 0, 8 4, 0 8" fill="#1d4ed8"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f0eee9"/>

      <!-- Header -->
      <text x="80" y="68" fill="#101828" font-size="28" font-weight="400" font-family="'Instrument Serif', serif">How /pr picks each next route</text>
      <text x="80" y="88" fill="#4c5665" font-size="8" font-family="'Geist', sans-serif">Ordinary route order; verified branch-update or sweep recovery resumes first on configured, open, non-draft PRs.</text>
      <text x="1200" y="48" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.12em">FIRST MATCHING CONDITION WINS</text>
      <text x="1200" y="68" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.12em">FRESH AFTER EACH ROUTE</text>

      <!-- Continuation arrows, drawn before nodes -->
      <g fill="none" stroke="#4c5665" stroke-width="1.2" marker-end="url(#pr-routing-arrow)">
        <line x1="640" y1="136" x2="640" y2="144"/>
        <line x1="640" y1="180" x2="640" y2="184"/>
        <line x1="640" y1="220" x2="640" y2="224"/>
        <line x1="640" y1="260" x2="640" y2="264"/>
        <line x1="640" y1="300" x2="640" y2="304"/>
        <line x1="640" y1="340" x2="640" y2="344"/>
        <line x1="640" y1="380" x2="640" y2="384"/>
        <line x1="640" y1="420" x2="640" y2="424"/>
        <line x1="640" y1="460" x2="640" y2="464"/>
        <line x1="640" y1="500" x2="640" y2="504"/>
        <line x1="640" y1="540" x2="640" y2="544"/>
        <line x1="640" y1="580" x2="640" y2="584"/>
      </g>

      <!-- Input node -->
      <rect x="240" y="96" width="800" height="40" rx="8" fill="rgba(29,78,216,0.08)" stroke="#1d4ed8" stroke-width="1.2"/>
      <text x="640" y="114" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/pr reads fresh state</text>
      <text x="640" y="129" fill="#1d4ed8" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">GITHUB + LOCAL STATE</text>

      <!-- 1 -->
      <rect x="120" y="144" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="148" x2="176" y2="176" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="148" x2="704" y2="176" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="167" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <text x="200" y="158" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">No PR; distinct branch ref; no Git operation in progress</text>
      <text x="200" y="173" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Ahead commits or ordinary pending work</text>
      <text x="728" y="155" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="171" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Create pull request</text>
      <text x="1136" y="155" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">pi-pr-create</text>

      <!-- 2 -->
      <rect x="120" y="184" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="188" x2="176" y2="216" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="188" x2="704" y2="216" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="207" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <text x="200" y="195" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="211" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Inferred open PR (including draft)</text>
      <text x="728" y="195" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="211" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Link exact remote ref; rediscover</text>
      <text x="1136" y="195" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">link-branch; draft stops after discovery</text>

      <!-- 3 -->
      <rect x="120" y="224" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="228" x2="176" y2="256" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="228" x2="704" y2="256" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="247" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <text x="200" y="235" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="251" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Merged, closed, or configured draft</text>
      <text x="728" y="235" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="251" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Report without changes</text>
      <text x="1136" y="235" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">report current state</text>

      <!-- 4 -->
      <rect x="120" y="264" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="268" x2="176" y2="296" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="268" x2="704" y2="296" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="287" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <text x="200" y="275" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="291" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Local HEAD behind or diverged (clean)</text>
      <text x="728" y="275" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="291" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Sync local branch</text>
      <text x="1136" y="275" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">ff-only or rebase onto PR head; never pushes</text>

      <!-- 5 -->
      <rect x="120" y="304" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="308" x2="176" y2="336" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="308" x2="704" y2="336" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="327" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <text x="200" y="315" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="331" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Dirty or ahead local work (diverged commits first)</text>
      <text x="728" y="315" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="331" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Publish scoped work</text>
      <text x="1136" y="315" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">pi-pr-publish-work</text>

      <!-- 6 -->
      <rect x="120" y="344" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="348" x2="176" y2="376" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="348" x2="704" y2="376" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="367" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      <text x="200" y="355" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="371" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">GitHub mergeability still computing</text>
      <text x="728" y="355" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="371" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Re-read fresh state</text>
      <text x="1136" y="355" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">up to 3 re-reads, 5 s apart</text>

      <!-- 7 -->
      <rect x="120" y="384" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="388" x2="176" y2="416" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="388" x2="704" y2="416" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="407" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>
      <text x="200" y="395" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="411" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Confirmed conflict or behind base</text>
      <text x="728" y="395" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="411" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Update against pinned base</text>
      <text x="1136" y="395" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">pi-pr-update-branch; exact lease push</text>

      <!-- 8 -->
      <rect x="120" y="424" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="428" x2="176" y2="456" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="428" x2="704" y2="456" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="447" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">8</text>
      <text x="200" y="435" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="451" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">CI failed</text>
      <text x="728" y="435" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="451" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Fix CI</text>
      <text x="1136" y="435" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">pi-pr-fix-ci; other failed checks block</text>

      <!-- 9 -->
      <rect x="120" y="464" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="468" x2="176" y2="496" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="468" x2="704" y2="496" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="487" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">9</text>
      <text x="200" y="475" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="491" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Changes requested, unresolved threads, or new feedback</text>
      <text x="728" y="475" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="491" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Sweep</text>
      <text x="1136" y="475" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">pi-pr-comment-sweep</text>

      <!-- 10 -->
      <rect x="120" y="504" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="508" x2="176" y2="536" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="508" x2="704" y2="536" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="527" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">10</text>
      <text x="200" y="515" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="531" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">CI or required Codex review running, nothing else blocking</text>
      <text x="728" y="515" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="531" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Wait, then re-read</text>
      <text x="1136" y="515" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">poll every ciPollSeconds; shared ciWaitMinutes budget</text>

      <!-- 11 -->
      <rect x="120" y="544" width="1040" height="36" rx="6" fill="#ffffff" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="176" y1="548" x2="176" y2="576" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <line x1="704" y1="548" x2="704" y2="576" stroke="rgba(16,24,40,0.141)" stroke-width="1"/>
      <text x="148" y="567" fill="#4c5665" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">11</text>
      <text x="200" y="555" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="571" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Required human review or policy pending</text>
      <text x="728" y="555" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="571" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Report without changes</text>
      <text x="1136" y="555" fill="#4c5665" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">no polling for human review</text>

      <!-- 12 -->
      <rect x="120" y="584" width="1040" height="36" rx="6" fill="rgba(29,78,216,0.08)" stroke="#1d4ed8" stroke-width="1.2"/>
      <line x1="176" y1="588" x2="176" y2="616" stroke="rgba(29,78,216,0.32)" stroke-width="1"/>
      <line x1="704" y1="588" x2="704" y2="616" stroke="rgba(29,78,216,0.32)" stroke-width="1"/>
      <text x="148" y="607" fill="#1d4ed8" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">12</text>
      <text x="200" y="595" fill="#1d4ed8" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONDITION</text>
      <text x="200" y="611" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Merge-ready</text>
      <text x="728" y="595" fill="#1d4ed8" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ROUTE</text>
      <text x="728" y="611" fill="#101828" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Confirm, recheck, merge</text>
      <text x="1136" y="595" fill="#1d4ed8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">configured mergeMethod; expected-head mutation</text>

      <!-- Legend strip -->
      <line x1="44" y1="640" x2="1236" y2="640" stroke="rgba(16,24,40,0.141)" stroke-width="0.8"/>
      <line x1="80" y1="650" x2="80" y2="674" stroke="#4c5665" stroke-width="1.2" marker-end="url(#pr-routing-arrow)"/>
      <text x="104" y="654" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">DOWNWARD CONNECTOR</text>
      <text x="104" y="674" fill="#101828" font-size="8" font-family="'Geist', sans-serif">Otherwise, continue to the next condition.</text>
      <text x="668" y="672" fill="#101828" font-size="28" font-weight="400" font-family="'Instrument Serif', serif">↻</text>
      <text x="724" y="654" fill="#4c5665" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">CONTINUATION RULE</text>
      <text x="724" y="674" fill="#101828" font-size="8" font-family="'Geist', sans-serif">The first match runs; link, sync, re-read, and completed routes return to fresh discovery.</text>
    </svg>
    </div>
  </main>
</body>
</html>
