<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="remote-action-flow-title remote-action-flow-desc" id="remote-action-flow-root">
      <title id="remote-action-flow-title">Remote 1Password action flow</title>
      <desc id="remote-action-flow-desc">Pi sends an action name over a private tunnel to the Approval Mac, where 1Password can prompt for Touch ID and the companion sends the credential to the configured service before it returns only the action status to Pi.</desc>
      <defs>
      <style>#remote-action-flow-root figure { margin: 0 auto; max-width: 1280px; overflow-x: auto; }
      #remote-action-flow-root figure { overflow-x: visible; }
      #remote-action-flow-root .sans, #remote-action-flow-root .sans { font-family: Geist, system-ui, sans-serif; }
      #remote-action-flow-root .mono, #remote-action-flow-root .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
      #remote-action-flow-root .actor { fill: #fff; stroke: #4c5665; stroke-width: 1.2; }
      #remote-action-flow-root .name { fill: #101828; font-size: 24px; font-weight: 600; }
      #remote-action-flow-root .detail { fill: #4c5665; font-size: 17px; }
      #remote-action-flow-root .message { fill: none; stroke: #4c5665; stroke-width: 2; marker-end: url(#remote-action-flow-arrow); }
      #remote-action-flow-root .reply { stroke-dasharray: 6 5; }
      #remote-action-flow-root .credential { stroke: #1d4ed8; marker-end: url(#remote-action-flow-arrow-blue); }
      #remote-action-flow-root .lifeline { stroke: #4c5665; stroke-opacity: .45; stroke-width: 1.2; stroke-dasharray: 4 6; }
      #remote-action-flow-root .activation { fill: #e6e4de; stroke: #4c5665; stroke-width: 1; }
      #remote-action-flow-root .label { fill: #101828; font-size: 18px; font-weight: 500; text-anchor: middle; letter-spacing: .04em; }</style>
        <style>
          #remote-action-flow-root .sans, svg .sans { font-family: Geist, system-ui, sans-serif; }
          #remote-action-flow-root .mono, svg .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
          .actor { fill: #fff; stroke: #4c5665; stroke-width: 1.2; }
          .name { fill: #101828; font-size: 24px; font-weight: 600; }
          .detail { fill: #4c5665; font-size: 17px; }
          .message { fill: none; stroke: #4c5665; stroke-width: 2; marker-end: url(#remote-action-flow-arrow); }
          .reply { stroke-dasharray: 6 5; }
          .credential { stroke: #1d4ed8; marker-end: url(#remote-action-flow-arrow-blue); }
          .lifeline { stroke: #4c5665; stroke-opacity: .45; stroke-width: 1.2; stroke-dasharray: 4 6; }
          .activation { fill: #e6e4de; stroke: #4c5665; stroke-width: 1; }
          .label { fill: #101828; font-size: 18px; font-weight: 500; text-anchor: middle; letter-spacing: .04em; }
        </style>
        <marker id="remote-action-flow-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
          <path d="M0 0 L8 4 L0 8 Z" fill="#4c5665"/>
        </marker>
        <marker id="remote-action-flow-arrow-blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
          <path d="M0 0 L8 4 L0 8 Z" fill="#1d4ed8"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f0eee9"/>
      <rect x="320" y="40" width="608" height="632" rx="8" fill="#e6e4de" fill-opacity=".55" stroke="#4c5665" stroke-width="1.2" stroke-dasharray="6 5"/>
      <text class="sans name" x="344" y="80">Approval Mac</text>

      <g aria-hidden="true">
        <path class="lifeline" d="M144 180 V660 M464 180 V660 M784 180 V476 M784 500 V548 M784 572 V660 M1128 180 V660"/>
        <rect class="activation" x="140" y="236" width="8" height="404"/>
        <rect class="activation" x="460" y="244" width="8" height="396"/>
        <rect class="activation" x="780" y="320" width="8" height="88"/>
        <rect class="activation" x="1124" y="488" width="8" height="80"/>
      </g>

      <line class="message" x1="148" y1="244" x2="460" y2="244"/>
      <line class="message" x1="468" y1="320" x2="780" y2="320"/>
      <line class="message reply" x1="780" y1="400" x2="468" y2="400"/>
      <line class="message credential" x1="468" y1="488" x2="1124" y2="488"/>
      <line class="message reply" x1="1124" y1="560" x2="468" y2="560"/>
      <line class="message reply" x1="460" y1="632" x2="148" y2="632"/>

      <g class="mono label">
        <rect x="168" y="208" width="120" height="28" fill="#f0eee9"/>
        <text x="228" y="228">ACTION NAME</text>
        <rect x="556" y="284" width="136" height="28" fill="#ebe8e3"/>
        <text x="624" y="304">EXACT FIELD</text>
        <rect x="556" y="364" width="136" height="28" fill="#ebe8e3"/>
        <text x="624" y="384">FIELD VALUE</text>
        <rect x="944" y="452" width="168" height="28" fill="#f0eee9"/>
        <text x="1028" y="472" style="fill:#1d4ed8">HTTPS GET</text>
        <rect x="960" y="524" width="136" height="28" fill="#f0eee9"/>
        <text x="1028" y="544">HTTP STATUS</text>
        <rect x="168" y="596" width="120" height="28" fill="#f0eee9"/>
        <text x="228" y="616">STATUS ONLY</text>
      </g>
      <g class="sans detail" text-anchor="middle">
        <text x="228" y="272">Private SSH tunnel</text>
        <text x="624" y="352">Touch ID or approval reuse</text>
        <text x="1028" y="516">Credential in header</text>
      </g>

      <g text-anchor="middle">
        <rect class="actor" x="40" y="104" width="208" height="76" rx="6"/>
        <text class="sans name" x="144" y="136">Pi host</text>
        <text class="mono detail" x="144" y="160">onepassword_action</text>

        <rect class="actor" x="344" y="104" width="240" height="76" rx="6"/>
        <text class="sans name" x="464" y="136">Companion</text>
        <text class="mono detail" x="464" y="160">pi-1password serve</text>

        <rect class="actor" x="664" y="104" width="240" height="76" rx="6"/>
        <text class="sans name" x="784" y="136">1Password</text>
        <text class="mono detail" x="784" y="160">op read</text>

        <rect x="1016" y="104" width="224" height="76" rx="6" fill="#e6e4de" stroke="#4c5665" stroke-width="1.2"/>
        <text class="sans name" x="1128" y="136">Configured service</text>
        <text class="sans detail" x="1128" y="160">Receives the credential</text>
      </g>
    </svg>
