<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orchestration-architecture-title orchestration-architecture-desc" id="orchestration-architecture-root">
        <title id="orchestration-architecture-title">Pi Subagent isolated workflow</title>
        <desc id="orchestration-architecture-desc">Workers commit checked candidates for Main to stage while siblings run, advance dependent waves, validate the combined tip, and explicitly promote into unchanged clean Main.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #orchestration-architecture-root { color: #101828; font-family: 'Geist', sans-serif; }
      #orchestration-architecture-root .diagram-scroll { overflow-x: auto; }
      #orchestration-architecture-root .section { fill: #6a7282; font: 500 8px 'Geist Mono', monospace; letter-spacing: .12em; }
      #orchestration-architecture-root .node { fill: #ffffff; stroke: #101828; stroke-width: 1; }
      #orchestration-architecture-root .input { fill: #e6e4de; stroke: #6a7282; stroke-width: 1; }
      #orchestration-architecture-root .focal { fill: #1d4ed8; fill-opacity: .08; stroke: #1d4ed8; stroke-width: 1.2; }
      #orchestration-architecture-root .optional { fill: #101828; fill-opacity: .02; stroke: #4c5665; stroke-width: 1; stroke-dasharray: 4 3; }
      #orchestration-architecture-root .tag { fill: #6a7282; font: 500 8px 'Geist Mono', monospace; }
      #orchestration-architecture-root .name { fill: #101828; font: 600 12px 'Geist', sans-serif; text-anchor: middle; }
      #orchestration-architecture-root .detail { fill: #4c5665; font: 400 12px 'Geist', sans-serif; text-anchor: middle; }
      #orchestration-architecture-root .code { fill: #4c5665; font: 400 8px 'Geist Mono', monospace; text-anchor: middle; }
      #orchestration-architecture-root .edge { fill: none; stroke: #4c5665; stroke-width: 1.2; marker-end: url(#orchestration-architecture-arrow); }
      #orchestration-architecture-root .branch { fill: none; stroke: #4c5665; stroke-width: 1; stroke-dasharray: 5 4; marker-end: url(#orchestration-architecture-arrow); }
      #orchestration-architecture-root .approved { fill: none; stroke: #1d4ed8; stroke-width: 1.2; marker-end: url(#orchestration-architecture-arrow-accent); }
      #orchestration-architecture-root .label-mask { fill: #f0eee9; }
      #orchestration-architecture-root .label { fill: #4c5665; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; }
      #orchestration-architecture-root .note-title { fill: #101828; font: 600 12px 'Geist', sans-serif; }
      #orchestration-architecture-root .note { fill: #4c5665; font: 400 12px 'Geist', sans-serif; }
      #orchestration-architecture-root .key { fill: #4c5665; font: 400 12px 'Geist', sans-serif; }</style>
          <style>
            .section { fill: #6a7282; font: 500 8px 'Geist Mono', monospace; letter-spacing: .12em; }
            .node { fill: #ffffff; stroke: #101828; stroke-width: 1; }
            .input { fill: #e6e4de; stroke: #6a7282; stroke-width: 1; }
            .focal { fill: #1d4ed8; fill-opacity: .08; stroke: #1d4ed8; stroke-width: 1.2; }
            .optional { fill: #101828; fill-opacity: .02; stroke: #4c5665; stroke-width: 1; stroke-dasharray: 4 3; }
            .tag { fill: #6a7282; font: 500 8px 'Geist Mono', monospace; }
            .name { fill: #101828; font: 600 12px 'Geist', sans-serif; text-anchor: middle; }
            .detail { fill: #4c5665; font: 400 12px 'Geist', sans-serif; text-anchor: middle; }
            .code { fill: #4c5665; font: 400 8px 'Geist Mono', monospace; text-anchor: middle; }
            .edge { fill: none; stroke: #4c5665; stroke-width: 1.2; marker-end: url(#orchestration-architecture-arrow); }
            .branch { fill: none; stroke: #4c5665; stroke-width: 1; stroke-dasharray: 5 4; marker-end: url(#orchestration-architecture-arrow); }
            .approved { fill: none; stroke: #1d4ed8; stroke-width: 1.2; marker-end: url(#orchestration-architecture-arrow-accent); }
            .label-mask { fill: #f0eee9; }
            .label { fill: #4c5665; font: 500 8px 'Geist Mono', monospace; text-anchor: middle; }
            .note-title { fill: #101828; font: 600 12px 'Geist', sans-serif; }
            .note { fill: #4c5665; font: 400 12px 'Geist', sans-serif; }
            .key { fill: #4c5665; font: 400 12px 'Geist', sans-serif; }
          </style>
          <marker id="orchestration-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#4c5665"/>
          </marker>
          <marker id="orchestration-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
          </marker>
        </defs>
        <rect width="1280" height="720" fill="#f0eee9"/>
        <text class="section" x="40" y="120">CANDIDATE PRODUCTION</text>
        <text class="section" x="40" y="320">MAIN'S EXPLICIT ACTIONS</text>

        <!-- Draw connectors and their labels before nodes. -->
        <line class="edge" x1="256" y1="208" x2="304" y2="208"/>
        <line class="edge" x1="560" y1="208" x2="608" y2="208"/>
        <line class="edge" x1="880" y1="208" x2="928" y2="208"/>
        <line class="edge" x1="1064" y1="272" x2="1064" y2="344"/>
        <line class="edge" x1="928" y1="408" x2="880" y2="408"/>
        <line class="approved" x1="568" y1="408" x2="472" y2="408"/>
        <line class="branch" x1="1064" y1="472" x2="1064" y2="520"/>
        <path class="branch" d="M1200 564 H1224 Q1232 564 1232 556 V96 Q1232 88 1224 88 H440 Q432 88 432 96 V144"/>
        <rect class="label-mask" x="884" y="388" width="40" height="12" rx="2"/>
        <text class="label" x="904" y="396">SETTLED</text>
        <rect class="label-mask" x="500" y="388" width="40" height="12" rx="2"/>
        <text class="label" x="520" y="396">PASS</text>
        <rect class="label-mask" x="1072" y="488" width="72" height="12" rx="2"/>
        <text class="label" x="1108" y="496">DEPENDENTS</text>
        <rect class="label-mask" x="716" y="68" width="80" height="12" rx="2"/>
        <text class="label" x="756" y="76">STAGED BASE</text>

        <rect class="input" x="40" y="144" width="216" height="128" rx="6"/>
        <text class="tag" x="56" y="168">MAIN</text>
        <text class="name" x="148" y="200">Start isolated request</text>
        <text class="code" x="148" y="224">delegate_task · mode: isolated</text>
        <text class="detail" x="148" y="248">Keep the durable request ID.</text>

        <rect class="node" x="304" y="144" width="256" height="128" rx="6"/>
        <text class="tag" x="320" y="168">WORKERS</text>
        <text class="name" x="432" y="200">Commit candidates</text>
        <text class="detail" x="432" y="224">Use owned worktrees.</text>
        <text class="detail" x="432" y="248">No tracked or untracked changes.</text>

        <rect class="node" x="608" y="144" width="272" height="128" rx="6"/>
        <text class="tag" x="624" y="168">RUNNER</text>
        <text class="name" x="744" y="200">Run preliminary checks</text>
        <text class="detail" x="744" y="224">Include optional task judgment.</text>
        <text class="detail" x="744" y="248">Bind evidence to the exact candidate.</text>

        <rect class="node" x="928" y="144" width="272" height="128" rx="6"/>
        <text class="tag" x="944" y="168">RUNNER → MAIN</text>
        <text class="name" x="1064" y="200">Send ready follow-up</text>
        <text class="detail" x="1064" y="224">Readiness is not promotion.</text>
        <text class="code" x="1064" y="248">subagent_status</text>

        <rect class="focal" x="928" y="344" width="272" height="128" rx="6"/>
        <text class="tag" x="944" y="368">MAIN · INTEGRATION CHECKOUT</text>
        <text class="name" x="1064" y="400">Stage exact candidates</text>
        <text class="code" x="1064" y="424">subagent_stage</text>
        <text class="detail" x="1064" y="448">Stage while siblings run.</text>

        <rect class="node" x="568" y="344" width="312" height="128" rx="6"/>
        <text class="tag" x="584" y="368">MAIN · AFTER THE WAVE SETTLES</text>
        <text class="name" x="724" y="400">Validate the exact combined tip</text>
        <text class="code" x="724" y="424">subagent_integrate validate</text>
        <text class="detail" x="724" y="448">Final checks and optional final judgment</text>

        <rect class="focal" x="160" y="344" width="312" height="128" rx="6"/>
        <text class="tag" x="176" y="368">MAIN · EXPLICIT PROMOTION</text>
        <text class="name" x="316" y="400">Promote passing work</text>
        <text class="code" x="316" y="424">subagent_integrate promote</text>
        <text class="detail" x="316" y="448">Main must be unchanged and clean.</text>

        <rect class="optional" x="928" y="520" width="272" height="88" rx="6"/>
        <text class="name" x="1064" y="544">Advance dependent tasks</text>
        <text class="code" x="1064" y="564">subagent_integrate advance</text>
        <text class="detail" x="1064" y="588">Run from the selected staged snapshot.</text>

        <!-- Safety details remain in the README as text. -->
        <text class="note-title" x="40" y="536">Blocked promotion preserves evidence.</text>
        <text class="note" x="40" y="560">Failures, conflicts, changed identities, or uncertain</text>
        <text class="note" x="40" y="580">outcomes require inspection, not replay.</text>
        <text class="note-title" x="520" y="536">One combined correction</text>
        <text class="note" x="520" y="560">After a definitive combined check or review failure,</text>
        <text class="note" x="520" y="580">commit one correction, record it, then validate again.</text>

        <line x1="40" y1="640" x2="1240" y2="640" stroke="#101828" stroke-opacity=".141"/>
        <line class="edge" x1="40" y1="672" x2="88" y2="672"/>
        <text class="key" x="104" y="676">Checked sequence</text>
        <line class="branch" x1="304" y1="672" x2="352" y2="672"/>
        <text class="key" x="368" y="676">Dependent wave, if needed</text>
        <text class="key" x="704" y="676">Staging, validation, and promotion require exact, clean Main.</text>
      </svg>
