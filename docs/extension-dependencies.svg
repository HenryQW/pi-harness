  <title id="extension-dependencies-title">Direct dependencies of 21 active Pi extensions</title>
  <desc id="extension-dependencies-desc">Matrix of 21 active Pi extensions and seven internal dependency packages, with 30 direct runtime or peer dependency edges, six rows with no internal dependencies, and Pi Config Store used by 14 extensions. Pi Subagent uses Pi Herdr for selected-checkout admission. Pi Cron and Pi Prompt Creator use Pi Subagent for explicit Role resources and server exposure rules.</desc>
