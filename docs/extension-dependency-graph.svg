      <rect class="node" x="48" y="168" width="160" height="48" rx="6"/>
      <text class="name" x="128" y="196">pi-memory</text>
      <text class="sub" x="128" y="208">4 RELATIONSHIPS</text>

      <rect class="node" x="296" y="168" width="160" height="48" rx="6"/>
      <text class="name" x="376" y="196">pi-notes</text>
      <text class="sub" x="376" y="208">CONFIG CONSUMER</text>

      <rect class="node" x="544" y="168" width="160" height="48" rx="6"/>
      <text class="name" x="624" y="196">pi-session-recall</text>
      <text class="sub" x="624" y="208">CONFIG CONSUMER</text>

      <rect class="node" x="792" y="168" width="160" height="48" rx="6"/>
      <text class="name" x="872" y="196">pi-subagent</text>
      <text class="sub" x="872" y="208">4 RELATIONSHIPS</text>

      <rect class="node-leaf" x="1040" y="168" width="160" height="48" rx="6"/>
      <text class="name" x="1120" y="196">pi-undo</text>
      <text class="sub" x="1120" y="208">STANDALONE</text>

      <!-- Shared/provider nodes -->
      <rect class="node" x="48" y="348" width="160" height="56" rx="6"/>
      <text class="name" x="128" y="376">pi-herdr-btw</text>
      <text class="sub" x="128" y="392">3 DEPENDENCIES</text>

      <rect class="node" x="296" y="348" width="160" height="56" rx="6"/>
      <text class="name" x="376" y="376">pi-open-in</text>
      <text class="sub" x="376" y="392">CONFIG CONSUMER</text>

      <rect class="node" x="592" y="348" width="160" height="56" rx="6"/>
      <text class="name" x="672" y="376">pi-task-models</text>
      <text class="sub" x="672" y="392">5 CONSUMERS</text>

      <rect class="node-leaf" x="1000" y="348" width="160" height="56" rx="6"/>
      <text class="name" x="1080" y="376">pi-pr</text>
      <text class="sub" x="1080" y="392">PR STATUS PROVIDER</text>

      <rect class="node-leaf" x="48" y="508" width="160" height="56" rx="6"/>
      <text class="name" x="128" y="536">pi-herdr</text>
      <text class="sub" x="128" y="552">4 CONSUMERS</text>

      <rect class="node" x="592" y="508" width="160" height="56" rx="6"/>
      <text class="name" x="672" y="536">pi-multi-codex</text>
      <text class="sub" x="672" y="552">3 CONSUMERS</text>

      <rect class="node-leaf" x="840" y="508" width="160" height="56" rx="6"/>
      <text class="name" x="920" y="536">pi-ask-question</text>
      <text class="sub" x="920" y="552">2 CONSUMERS</text>

      <!-- Foundation + standalone -->
      <rect class="node-hub" x="592" y="688" width="160" height="56" rx="6"/>
      <text class="name" x="672" y="716">pi-config-store</text>
      <text class="sub" x="672" y="732">9 CONSUMERS</text>

      <rect class="node-leaf" x="920" y="688" width="128" height="56" rx="6"/>
      <text class="name" x="984" y="716">pi-add-dir</text>
      <text class="sub" x="984" y="732">STANDALONE</text>

      <rect class="node-leaf" x="1072" y="688" width="128" height="56" rx="6"/>
      <text class="name" x="1136" y="716">pi-deps</text>
      <text class="sub" x="1136" y="732">STANDALONE</text>

      <!-- Legend -->
      <line x1="24" y1="840" x2="1256" y2="840" stroke="rgba(16,24,40,.141)" stroke-width="0.8"/>
      <text class="zone-label" x="24" y="860">LEGEND</text>
      <line x1="120" y1="856" x2="156" y2="856" stroke="#4c5665" stroke-width="1.1" marker-end="url(#arrow)"/>
      <text class="legend" x="168" y="860">npm dependency</text>
      <line x1="304" y1="856" x2="340" y2="856" stroke="#6a7282" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <text class="legend" x="352" y="860">Direct runtime coupling</text>
      <rect class="node-hub" x="536" y="848" width="24" height="12" rx="2"/>
      <text class="legend" x="568" y="860">Highest fan-in</text>
      <rect class="node-leaf" x="688" y="848" width="24" height="12" rx="2"/>
      <text class="legend" x="720" y="860">Provider / standalone</text>
      <text class="sub" x="1120" y="860">20 EXTENSIONS · 26 RELATIONSHIPS</text>
    </svg>
